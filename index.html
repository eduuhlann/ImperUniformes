            "@type": "Answer",
            "text": "Produzimos a partir de 20 peças, permitindo variações de tamanhos e modelos para compor a equipe da sua empresa."
          }
        },
        {
          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Atendemos e enviamos uniformes para empresas em todo o território nacional através de transportadoras parceiras com rastreio e seguro."

        },
        {
          "@type": "Question",
          "name": "Qual é o prazo médio de confecção e entrega?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O prazo varia de acordo com o volume de peças e a complexidade da personalização. O prazo exato é informado com clareza na proposta comercial e cumprido rigorosamente."

        },

          "@type": "Question",
          "name": "Como envio o logotipo da minha empresa?",

          "@type": "Question",
          "name": "Qual a diferença entre Bordado, Silk Screen e DTF?",

            "@type": "Answer",

          }
        }
      ]
